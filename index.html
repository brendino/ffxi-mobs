<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFXI Mob Spawn Viewer</title>
    <script src="map_data.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-top: 0; margin-bottom: 15px; }
        .controls {
            background-color: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            gap: 25px;
            align-items: flex-start;
            flex-wrap: wrap;
            max-width: 95vw;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .checkbox-list {
            background: #1e1e1e;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 8px;
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 220px;
        }
        .checkbox-list label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            user-select: none;
        }
        select, button, input[type="text"] {
            padding: 6px 10px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #333;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #444;
        }
        button:active {
            background-color: #555;
        }
        
        /* Map Tabs */
        .tab-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            max-width: 100%;
            margin-bottom: 8px;
            padding-bottom: 4px;
        }
        .tab-pill {
            background: #2d2d2d;
            border: 1px solid #555;
            border-radius: 6px 6px 0 0;
            padding: 6px 14px;
            font-size: 14px;
            color: #bbb;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s;
        }
        .tab-pill:hover {
            background: #3d3d3d;
            color: #fff;
        }
        .tab-pill.active {
            background: #444;
            color: #fff;
            border-color: #57a1f8;
            border-bottom-color: #444;
            font-weight: bold;
        }
        .tab-close {
            color: #888;
            font-weight: bold;
            border-radius: 50%;
            padding: 0 4px;
            font-size: 12px;
            line-height: 1;
        }
        .tab-close:hover {
            color: #ff4444;
            background: rgba(255,255,255,0.15);
        }

        .map-container {
            position: relative;
            display: inline-block;
            border: 2px solid #444;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background-color: #000;
        }
        #mapImage {
            display: block;
        }
        #spawnCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        #tooltip {
            position: absolute;
            background-color: rgba(20, 20, 20, 0.95);
            color: #fff;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            z-index: 1000;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #tooltip.frozen .tooltip-close {
            display: block !important;
        }
    </style>
</head>

    <div class="controls">

            <div id="zoneFilterContainer" class="checkbox-list">

            </div>
        </div>

                <span id="clearSearchBtn" style="position: absolute; right: 8px; top: 5px; cursor: pointer; color: #888; display: none; font-size: 14px;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#888'">&#10006;</span>
            </div>
            <div style="display: flex; gap: 5px;">
                <button id="selectAllBtn" type="button" style="font-size: 12px; padding: 4px 8px; flex: 1;">Select All</button>
                <button id="selectNoneBtn" type="button" style="font-size: 12px; padding: 4px 8px; flex: 1;">Select None</button>
            </div>
            <div id="mobFilterContainer" class="checkbox-list">
                <!-- Checkboxes injected here -->
            </div>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 8px; align-self: center;">
            <span id="stats" style="font-size: 14px; font-weight: 500;"></span>
        </div>
    </div>

    <!-- Map Tabs & Viewing Area -->
    <div style="display: flex; flex-direction: column; max-width: 95vw;">
        <div id="mapTabHeader" style="display: flex; align-items: center; width: 100%; margin-bottom: 8px;">
            <div id="mapTabBar" class="tab-bar" style="flex: 1; min-width: 0; margin-bottom: 0;">
                <!-- Map tabs rendered here -->
            </div>
            <div id="closeAllTabBarPill" class="tab-pill" style="display: none; flex-shrink: 0; background: #4a1515; border-color: #993333; color: #ff9999; margin-left: 10px; font-weight: bold; font-size: 13px; padding: 6px 12px; height: fit-content;" title="Close all open map tabs">
                Close All &#10006;

        </div>

        <div style="display: flex; gap: 20px; align-items: flex-start;">
            <div style="display: flex; flex-direction: column; align-items: center; background: #2d2d2d; padding: 10px; border-radius: 8px; border: 1px solid #555; height: 250px; width: 50px; box-sizing: border-box;">
                <span style="font-weight: bold; font-size: 20px; line-height: 1;">+</span>
                <div style="position: relative; flex-grow: 1; width: 100%;">
                    <input type="range" id="zoomSlider" min="1" max="5" step="0.25" value="1" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(270deg); width: 180px; cursor: pointer; margin: 0;">
                </div>
                <span style="font-weight: bold; font-size: 24px; line-height: 1;">-</span>
            </div>
            
            <div id="scrollContainer" style="overflow: hidden; border: 2px solid #444; background-color: #000; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: grab; position: relative; user-select: none; -webkit-user-select: none; max-height: 75vh;">
                <div class="map-container" id="mapContainer" style="border: none; box-shadow: none;">
                    <img id="mapImage" src="" alt="Select a zone to view map" draggable="false" style="display: block; transform-origin: top left;">
                    <canvas id="spawnCanvas"></canvas>
                </div>
            </div>
            
            <div id="legendContainer" style="background: #2d2d2d; border-radius: 8px; padding: 15px; border: 1px solid #555; width: 250px; max-height: 75vh; overflow-y: auto; display: flex; flex-direction: column;">

                <div id="legendItems" style="display: flex; flex-direction: column; gap: 8px;"></div>
            </div>
        </div>
    </div>

        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash % 360);
            return `hsl(${hue}, 80%, 60%)`;
        }

        // Pre-build zone search index filtered by submap Y-bounds (areaId -> set of lowercase mob names & drop names)
        const zoneSearchIndex = new Map();
        zonesData.forEach(z => {
            const spawns = mapData.spawns[z.hexZoneId] || [];
            const bounds = mapData.maps[z.areaId];
            const searchTerms = new Set();
            
            spawns.forEach(s => {
                if (bounds) {
                    if (bounds.boxes && bounds.boxes.length > 0) {
                        const inBox = bounds.boxes.some(b => 
                            s.x >= b.minX && s.x <= b.maxX &&
                            s.y >= b.minY && s.y <= b.maxY &&
                            s.z >= b.minZ && s.z <= b.maxZ
                        );
                        if (!inBox) return;
                    } else if (s.y < bounds.minY || s.y > bounds.maxY) {
                        return;
                    }
                }
                
                searchTerms.add(s.name.toLowerCase());
                if (s.drops) {
                    s.drops.forEach(d => searchTerms.add(d.name.toLowerCase()));
                }
            });
            zoneSearchIndex.set(z.areaId, searchTerms);
        });

        function populateZoneList() {
            const zQuery = zoneSearch.value.toLowerCase().trim();
            const mQueryRaw = mobSearch.value.trim();
            const mQueryExactMatch = mQueryRaw.startsWith('"') && mQueryRaw.endsWith('"') && mQueryRaw.length > 1;
            const mQuery = mQueryExactMatch ? mQueryRaw.slice(1, -1).toLowerCase() : mQueryRaw.toLowerCase();

            zoneFilterContainer.innerHTML = '';
            let visibleCount = 0;

            zonesData.forEach(z => {
                let matchesZoneSearch = !zQuery || z.name.toLowerCase().includes(zQuery);
                
                let matchesMobSearch = true;
                let matchCount = 0;
                if (mQuery) {
                    matchesMobSearch = false;
                    const terms = zoneSearchIndex.get(z.areaId);
                    if (terms) {
                        for (const term of terms) {
                            if (mQueryExactMatch ? term === mQuery : term.includes(mQuery)) {
                                matchesMobSearch = true;
                                matchCount++;
                            }
                        }
                    }
                }

                const isVisible = matchesZoneSearch && matchesMobSearch;
                if (!isVisible) return;
                visibleCount++;

                const bounds = mapData.maps[z.areaId];
                const hasMap = bounds && bounds.ext;
                
                const label = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = z.areaId;
                cb.checked = openTabs.includes(z.areaId);
                
                if (!hasMap) {
                    cb.disabled = true;
                }

                cb.addEventListener('change', () => {
                    if (cb.checked) {
                        openTab(z.areaId);
                    } else {
                        closeTab(z.areaId);
                    }
                });

                label.appendChild(cb);
                label.appendChild(document.createTextNode(z.name + (hasMap ? '' : ' (No Map)')));

                if (mQuery && matchCount > 0) {
                    const badge = document.createElement('span');
                    badge.style.fontSize = '12px';
                    badge.style.color = '#57a1f8';
                    badge.style.marginLeft = 'auto';
                    badge.textContent = `(${matchCount} ${matchCount === 1 ? 'match' : 'matches'})`;
                    label.appendChild(badge);
                }

                zoneFilterContainer.appendChild(label);
            });

            clearZoneSearchBtn.style.display = zQuery ? 'inline' : 'none';

            if (mQuery || zQuery) {
                openMatchingTabsBtn.textContent = `Open Matching (${visibleCount})`;
            } else {
                openMatchingTabsBtn.textContent = 'Open Matching Tabs';
            }
        }

        zoneSearch.addEventListener('input', populateZoneList);
        clearZoneSearchBtn.addEventListener('click', () => {
            zoneSearch.value = '';
            populateZoneList();
        });



        openMatchingTabsBtn.addEventListener('click', () => {
            const cbs = zoneFilterContainer.querySelectorAll('input[type="checkbox"]');
            const isQueryS = (zoneSearch.value && zoneSearch.value.toLowerCase().includes('[s]')) || 
                             (mobSearch.value && mobSearch.value.toLowerCase().includes('[s]'));
            let openedAny = false;
            cbs.forEach(cb => {
                const zObj = zonesData.find(z => z.areaId === cb.value);
                if (zObj && !isQueryS && zObj.name.includes('[S]')) return;
                if (!cb.checked && cb.style.display !== 'none' && !cb.disabled) {
                    cb.checked = true;
                    if (!openTabs.includes(cb.value)) {
                        openTabs.push(cb.value);
                        openedAny = true;
                    }
                }
            });
            if (openTabs.length > 0) {
                if (openedAny || !activeZoneId) {
                    activeZoneId = openTabs[openTabs.length - 1];
                }
                renderTabBar();
                updateMobFilterContainer();
                loadMap(activeZoneId);
            }
        });

        closeAllTabsBtn.addEventListener('click', () => {
            openTabs = [];
            activeZoneId = null;
            checkedMobs.clear();
            renderTabBar();

            updateMobFilterContainer();
            clearMapDisplay();

        function openTab(areaId) {
            if (!openTabs.includes(areaId)) {
                openTabs.push(areaId);
            }
            activeZoneId = areaId;
            renderTabBar();
            populateZoneList();
            updateMobFilterContainer();
            loadMap(activeZoneId);

        function closeTab(areaId) {
            const index = openTabs.indexOf(areaId);
            openTabs = openTabs.filter(id => id !== areaId);
            if (activeZoneId === areaId) {
                if (openTabs.length > 0) {
                    const newIndex = Math.max(0, index - 1);
                    activeZoneId = openTabs[newIndex];
                } else {
                    activeZoneId = null;
                }
            }
            if (openTabs.length === 0) {
                checkedMobs.clear();
            } else {
                for (const mob of checkedMobs) {
                    if (!openTabs.some(id => isMobInArea(mob, id))) {
                        checkedMobs.delete(mob);
                    }
                }
            }
            renderTabBar();
            populateZoneList();
            updateMobFilterContainer();
            if (activeZoneId) {
                loadMap(activeZoneId);
            } else {
                clearMapDisplay();
            }
        }

        const closeAllTabBarPill = document.getElementById('closeAllTabBarPill');

        closeAllTabBarPill.addEventListener('click', () => {
            openTabs = [];
            activeZoneId = null;
            checkedMobs.clear();
            renderTabBar();
            populateZoneList();
            updateMobFilterContainer();
            clearMapDisplay();
        });
        closeAllTabBarPill.addEventListener('mouseover', () => { closeAllTabBarPill.style.background = '#6b1d1d'; closeAllTabBarPill.style.color = '#ffffff'; });
        closeAllTabBarPill.addEventListener('mouseout', () => { closeAllTabBarPill.style.background = '#4a1515'; closeAllTabBarPill.style.color = '#ff9999'; });

        function renderTabBar() {
            mapTabBar.innerHTML = '';
            if (openTabs.length === 0) {
                mapTabBar.style.display = 'none';
                closeAllTabBarPill.style.display = 'none';
                return;
            }
            mapTabBar.style.display = 'flex';
            closeAllTabBarPill.style.display = 'flex';

            openTabs.forEach(areaId => {
                const zObj = zonesData.find(z => z.areaId === areaId);
                const zName = zObj ? zObj.name : areaId;

                const tab = document.createElement('div');
                tab.className = 'tab-pill' + (areaId === activeZoneId ? ' active' : '');
                
                const titleSpan = document.createElement('span');
                titleSpan.textContent = zName;
                tab.appendChild(titleSpan);

                const closeSpan = document.createElement('span');
                closeSpan.className = 'tab-close';
                closeSpan.innerHTML = '&#10006;';
                closeSpan.title = 'Close ' + zName + ' tab';
                closeSpan.addEventListener('click', (e) => {
                    e.stopPropagation();
                    closeTab(areaId);
                });
                tab.appendChild(closeSpan);

                tab.addEventListener('click', () => {
                    if (activeZoneId !== areaId) {
                        activeZoneId = areaId;
                        renderTabBar();
                        loadMap(activeZoneId);
                    }
                });

                mapTabBar.appendChild(tab);
            });
        }

        function clearMapDisplay() {
            ctx.clearRect(0, 0, spawnCanvas.width, spawnCanvas.height);
            mapImage.src = '';
            mapImage.alt = 'Select a zone to view map';
            legendItems.innerHTML = '<span style="color: #888; font-size: 14px;">No zone open.</span>';
            stats.textContent = 'No active map tab.';
        }

        let checkedMobs = new Set(); // Mobs explicitly checked by user

        function isMobInArea(mobName, areaId) {
            const hexId = areaId.split('_')[0];
            const bounds = mapData.maps[areaId];
            const spawns = mapData.spawns[hexId] || [];
            return spawns.some(s => {
                if (s.name !== mobName) return false;
                if (bounds) {
                    if (bounds.boxes && bounds.boxes.length > 0) {
                        return bounds.boxes.some(b => 
                            s.x >= b.minX && s.x <= b.maxX &&
                            s.y >= b.minY && s.y <= b.maxY &&
                            s.z >= b.minZ && s.z <= b.maxZ
                        );
                    }
                    return s.y >= bounds.minY && s.y <= bounds.maxY;
                }
                return true;
            });
        }

        function getMatchingZonesForMob(mobName, mQuery, mQueryExactMatch) {
            const zQuery = zoneSearch.value ? zoneSearch.value.trim().toLowerCase() : '';
            const matchingAreaIds = [];
            zonesData.forEach(z => {
                if (zQuery.length > 0 && !z.name.toLowerCase().includes(zQuery)) {
                    return;
                }

                const hexId = z.hexZoneId;
                const spawns = mapData.spawns[hexId] || [];
                const bounds = mapData.maps[z.areaId];
                
                if (!bounds || !bounds.ext) return;

                const hasSpawn = spawns.some(s => {
                    if (s.name !== mobName) return false;
                    
                    if (bounds.boxes && bounds.boxes.length > 0) {
                        const inBox = bounds.boxes.some(b => 
                            s.x >= b.minX && s.x <= b.maxX &&
                            s.y >= b.minY && s.y <= b.maxY &&
                            s.z >= b.minZ && s.z <= b.maxZ
                        );
                        if (!inBox) return false;
                    } else if (s.y < bounds.minY || s.y > bounds.maxY) {
                        return false;
                    }

                    if (mQuery && mQuery.length > 0) {
                        let mobNameMatch = false;
                        let dropMatch = false;
                        if (mQueryExactMatch) {
                            mobNameMatch = s.name.toLowerCase() === mQuery;
                            dropMatch = s.drops && s.drops.some(d => d.name.toLowerCase() === mQuery);
                        } else {
                            mobNameMatch = s.name.toLowerCase().includes(mQuery);
                            dropMatch = s.drops && s.drops.some(d => d.name.toLowerCase().includes(mQuery));
                        }
                        if (!mobNameMatch && !dropMatch) {
                            return false;
                        }
                    }
                    
                    return true;
                });
                if (hasSpawn) {
                    matchingAreaIds.push(z.areaId);
                }
            });

            const isQueryS = (mQuery && mQuery.includes('[s]')) || (zoneSearch.value && zoneSearch.value.toLowerCase().includes('[s]'));
            if (!isQueryS) {
                const nonSMatches = matchingAreaIds.filter(id => {
                    const zObj = zonesData.find(z => z.areaId === id);
                    return zObj && !zObj.name.includes('[S]');
                });
                if (nonSMatches.length > 0) {
                    return nonSMatches;
                }
            }

            return matchingAreaIds;
        }

        function updateMobFilterContainer() {
            const mQueryRaw = mobSearch.value.trim();
            const mQueryExactMatch = mQueryRaw.startsWith('"') && mQueryRaw.endsWith('"') && mQueryRaw.length > 1;
            const mQuery = mQueryExactMatch ? mQueryRaw.slice(1, -1).toLowerCase() : mQueryRaw.toLowerCase();
            const mobDropsMap = new Map();
            const mobZonesMap = new Map();
            const allSpawns = [];

            let candidateAreaIds = [];
            if (mQuery.length > 0) {
                const isQueryS = mQuery.includes('[s]') || (zoneSearch.value && zoneSearch.value.toLowerCase().includes('[s]'));
                candidateAreaIds = zonesData
                    .filter(z => isQueryS || !z.name.includes('[S]'))
                    .map(z => z.areaId);
            } else if (openTabs.length > 0) {
                candidateAreaIds = openTabs;
            } else {
                mobFilterContainer.innerHTML = '<div style="color:#888; font-size:13px; padding:6px 0;">Select a zone or search for a mob/item drop above.</div>';
                return;
            }

            candidateAreaIds.forEach(areaId => {
                const hexId = areaId.split('_')[0];
                const bounds = mapData.maps[areaId];
                const spawns = mapData.spawns[hexId] || [];
                spawns.forEach(s => {
                    if (bounds) {
                        if (bounds.boxes && bounds.boxes.length > 0) {
                            const inBox = bounds.boxes.some(b => 
                                s.x >= b.minX && s.x <= b.maxX &&
                                s.y >= b.minY && s.y <= b.maxY &&
                                s.z >= b.minZ && s.z <= b.maxZ
                            );
                            if (!inBox) return;
                        } else if (s.y < bounds.minY || s.y > bounds.maxY) {
                            return;
                        }
                    }

                    if (mQuery.length > 0) {
                        let mobNameMatch = false;
                        let dropMatch = false;
                        if (mQueryExactMatch) {
                            mobNameMatch = s.name.toLowerCase() === mQuery;
                            dropMatch = s.drops && s.drops.some(d => d.name.toLowerCase() === mQuery);
                        } else {
                            mobNameMatch = s.name.toLowerCase().includes(mQuery);
                            dropMatch = s.drops && s.drops.some(d => d.name.toLowerCase().includes(mQuery));
                        }
                        if (!mobNameMatch && !dropMatch) {
                            return;
                        }
                    }

                    allSpawns.push(s);
                    if (!mobZonesMap.has(s.name)) mobZonesMap.set(s.name, new Set());
                    mobZonesMap.get(s.name).add(areaId);

                    if (s.drops && s.drops.length > 0) {
                        if (!mobDropsMap.has(s.name)) mobDropsMap.set(s.name, new Set());
                        s.drops.forEach(d => mobDropsMap.get(s.name).add(d.name.toLowerCase()));
                    }
                });
            });

            const uniqueMobs = [...new Set(allSpawns.map(s => s.name))].sort();

            if (typeof hideMobSummaryTooltip === 'function') hideMobSummaryTooltip();
            mobFilterContainer.innerHTML = '';
            if (uniqueMobs.length === 0) {
                if (openTabs.length === 0 && mQuery.length === 0) {
                    mobFilterContainer.innerHTML = '<div style="color:#888; font-size:13px; padding:6px 0;">Select a zone or search for a mob/item drop above.</div>';
                } else {
                    mobFilterContainer.innerHTML = '<div style="color:#888; font-size:13px; padding:6px 0;">No matching mobs found.</div>';
                }
                return;
            }

            uniqueMobs.forEach(mob => {
                const cleanName = mob.replace(/_/g, ' ');
                const label = document.createElement('label');
                
                const dropsSet = mobDropsMap.get(mob);
                if (dropsSet) {
                    label.dataset.drops = Array.from(dropsSet).join(',');
                }
                
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = mob;
                cb.checked = checkedMobs.has(mob);

                cb.addEventListener('change', () => {
                    if (cb.checked) {
                        checkedMobs.add(mob);
                        const matchingAreaIds = getMatchingZonesForMob(mob, mQuery, mQueryExactMatch);
                        let newlyOpened = false;
                        matchingAreaIds.forEach(id => {
                            if (!openTabs.includes(id)) {
                                openTabs.push(id);
                                newlyOpened = true;
                            }
                        });
                        if (newlyOpened) {
                            if (!activeZoneId || !matchingAreaIds.includes(activeZoneId)) {
                                activeZoneId = matchingAreaIds[0];
                            }
                            renderTabBar();
                            populateZoneList();
                            updateMobFilterContainer();
                            loadMap(activeZoneId);
                            return;
                        }
                    } else {
                        checkedMobs.delete(mob);
                    }
                    if (activeZoneId) drawSpawns(activeZoneId);
                });
                
                label.appendChild(cb);
                label.appendChild(document.createTextNode(cleanName));
                
                const zonesSet = mobZonesMap.get(mob);
                let validZoneCount = 0;
                let missingZoneNames = [];
                if (zonesSet) {
                    zonesSet.forEach(areaId => {
                        const bounds = mapData.maps[areaId];
                        const hasMap = bounds && bounds.ext;
                        if (hasMap) {
                            validZoneCount++;
                        } else {
                            const zObj = zonesData.find(z => z.areaId === areaId);
                            missingZoneNames.push(zObj ? zObj.name : areaId);
                        }
                    });
                }
                
                if (validZoneCount > 0) {
                    const badge = document.createElement('span');
                    badge.style.fontSize = '11px';
                    badge.style.color = '#57a1f8';
                    badge.style.marginLeft = 'auto';
                    badge.textContent = '(' + validZoneCount + ' ' + (validZoneCount === 1 ? 'zone' : 'zones') + ')';
                    label.appendChild(badge);
                }
                
                if (missingZoneNames.length > 0) {
                    const missingBadge = document.createElement('span');
                    missingBadge.style.fontSize = '10px';
                    missingBadge.style.color = '#ff9999';
                    missingBadge.style.marginLeft = validZoneCount > 0 ? '4px' : 'auto';
                    missingBadge.title = 'No map image available for: ' + missingZoneNames.join(', ');
                    missingBadge.textContent = '(!)';
                    label.appendChild(missingBadge);
                }

                const colorIndicator = document.createElement('div');
                colorIndicator.style.width = '10px';
                colorIndicator.style.height = '10px';
                colorIndicator.style.borderRadius = '50%';
                colorIndicator.style.backgroundColor = stringToColor(mob);
                colorIndicator.style.marginLeft = (validZoneCount > 0 || missingZoneNames.length > 0) ? '6px' : 'auto';
                label.appendChild(colorIndicator);

                const primaryHexZone = activeZoneId ? activeZoneId.split('_')[0] : (zonesSet && zonesSet.size > 0 ? Array.from(zonesSet)[0].split('_')[0] : null);

                label.addEventListener('mouseenter', (e) => showMobSummaryTooltip(e, mob, primaryHexZone));
                label.addEventListener('mousemove', (e) => {
                    if (!tooltipFrozen && tooltip.style.display === 'block') {
                        updateTooltipPosition(e);
                    }
                });
                label.addEventListener('mouseleave', hideMobSummaryTooltip);
                
                mobFilterContainer.appendChild(label);
            });
        }

        mobSearch.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query.length > 0) {
                clearSearchBtn.style.display = 'inline';
            } else {
                clearSearchBtn.style.display = 'none';
            }
            
            updateMobFilterContainer();
            populateZoneList();
        });
        
        clearSearchBtn.addEventListener('click', () => {
            mobSearch.value = '';
            mobSearch.dispatchEvent(new Event('input'));
        });
        
        selectAllBtn.addEventListener('click', () => {
            const labels = mobFilterContainer.querySelectorAll('label');
            let newlyOpened = false;
            let changed = false;
            const mQueryRaw = mobSearch.value.trim();
            const mQueryExactMatch = mQueryRaw.startsWith('"') && mQueryRaw.endsWith('"') && mQueryRaw.length > 1;
            const mQuery = mQueryExactMatch ? mQueryRaw.slice(1, -1).toLowerCase() : mQueryRaw.toLowerCase();
            
            labels.forEach(label => {
                if (label.style.display !== 'none') {
                    const cb = label.querySelector('input');
                    const mob = cb.value;
                    if (!cb.checked) {
                        cb.checked = true;
                        checkedMobs.add(mob);
                        changed = true;
                        
                        const matchingAreaIds = getMatchingZonesForMob(mob, mQuery, mQueryExactMatch);
                        matchingAreaIds.forEach(id => {
                            if (!openTabs.includes(id)) {
                                openTabs.push(id);
                                newlyOpened = true;
                            }
                        });
                    }
                }
            });
            
            if (newlyOpened) {
                if (!activeZoneId && openTabs.length > 0) {
                    activeZoneId = openTabs[0];
                }
                renderTabBar();
                populateZoneList();
                updateMobFilterContainer();
                loadMap(activeZoneId);
            } else if (changed && activeZoneId) {
                drawSpawns(activeZoneId);
            }
        });

        selectNoneBtn.addEventListener('click', () => {
            const labels = mobFilterContainer.querySelectorAll('label');
            let changed = false;
            labels.forEach(label => {
                if (label.style.display !== 'none') {
                    const cb = label.querySelector('input');
                    const mob = cb.value;
                    if (cb.checked) {
                        cb.checked = false;
                        checkedMobs.delete(mob);
                        changed = true;
                    }
                }
            });
            if (changed && activeZoneId) drawSpawns(activeZoneId);
        });

        window.addFilter = function(mobName, hexIdsStr) {
            mobSearch.value = '';
            
            if (!checkedMobs.has(mobName)) {
                checkedMobs.add(mobName);
            }
            
            renderTabBar();
            populateZoneList();
            updateMobFilterContainer();
            
            if (activeZoneId) {
                loadMap(activeZoneId);
                drawSpawns(activeZoneId);
            }
            
            if (hexIdsStr) {
                const hexes = hexIdsStr.split(',');
                hexes.forEach(h => {
                    const decimalId = parseInt(h.trim(), 16);
                    if (!isNaN(decimalId)) {
                        flashingMobs.set(mobName + '_' + decimalId, Date.now());
                    }
                });
                if (!animationFrameId) renderLoop();
            }
        };

        zoomSlider.addEventListener('input', applyZoom);

        scrollContainer.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        scrollContainer.addEventListener('mousedown', (e) => {
            if (e.button === 2) {
                const now = Date.now();
                if (now - lastRightClickTime < 400) {
                    changeZoomLevels(-1.0, e);
                    lastRightClickTime = 0;
                } else {
                    lastRightClickTime = now;
                }
            } else if (e.button === 0) {
                isDragging = true;
                hasDragged = false;
                scrollContainer.style.cursor = 'grabbing';
                startX = e.pageX - scrollContainer.offsetLeft;
                startY = e.pageY - scrollContainer.offsetTop;
                scrollLeft = scrollContainer.scrollLeft;
                scrollTop = scrollContainer.scrollTop;
            }
        });
        scrollContainer.addEventListener('mouseleave', () => {
            isDragging = false;
            scrollContainer.style.cursor = 'grab';
        });
        scrollContainer.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                isDragging = false;
                scrollContainer.style.cursor = 'grab';
                setTimeout(() => { hasDragged = false; }, 50);
            }
        });
        scrollContainer.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            hasDragged = true;
            e.preventDefault();
            const x = e.pageX - scrollContainer.offsetLeft;
            const y = e.pageY - scrollContainer.offsetTop;
            const walkX = (x - startX);
            const walkY = (y - startY);
            scrollContainer.scrollLeft = scrollLeft - walkX;
            scrollContainer.scrollTop = scrollTop - walkY;
        });

        scrollContainer.addEventListener('dblclick', (e) => {
            if (e.button === 0) {
                changeZoomLevels(1.0, e);
            }
        });

        function changeZoomLevels(increment, e) {
            const oldScale = parseFloat(zoomSlider.value);
            let newScale = oldScale + increment;
            
            if (newScale > parseFloat(zoomSlider.max)) newScale = parseFloat(zoomSlider.max);
            if (newScale < parseFloat(zoomSlider.min)) newScale = parseFloat(zoomSlider.min);
            if (newScale === oldScale) return;
            
            const rect = scrollContainer.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const mapX = scrollContainer.scrollLeft + mouseX;
            const mapY = scrollContainer.scrollTop + mouseY;
            
            zoomSlider.value = newScale;
            applyZoom();
            
            const ratio = newScale / oldScale;
            scrollContainer.scrollLeft = (mapX * ratio) - mouseX;
            scrollContainer.scrollTop = (mapY * ratio) - mouseY;
        }

        function applyZoom() {
            if (!mapImage.naturalWidth || !activeZoneId) return;
            const scale = parseFloat(zoomSlider.value);
            const newSize = baseViewportSize * scale;
            
            mapImage.style.width = newSize + 'px';
            mapImage.style.height = newSize + 'px';
            spawnCanvas.style.width = newSize + 'px';
            spawnCanvas.style.height = newSize + 'px';
            
            drawSpawns(activeZoneId);
        }

        function loadMap(areaId) {
            if (!areaId) {
                clearMapDisplay();
                return;
            }

            const hexZoneId = areaId.split('_')[0];
            const bounds = mapData.maps[areaId];
            if (bounds && bounds.ext) {
                if (bounds.ext === 'png' && bounds.hdMapFile) {
                    mapImage.src = 'HD_Maps/' + bounds.hdMapFile;
                } else if (bounds.ext === 'gif') {
                    mapImage.src = areaId + '.gif';
                }
            } else {
                mapImage.src = '';
                mapImage.alt = 'No map available';
                ctx.clearRect(0, 0, spawnCanvas.width, spawnCanvas.height);
                stats.textContent = 'Map image not found for this zone.';
                return;
            }
            
            ctx.clearRect(0, 0, spawnCanvas.width, spawnCanvas.height);
            stats.textContent = 'Loading map...';
            
            mapImage.onload = () => {
                spawnCanvas.width = mapImage.naturalWidth;
                spawnCanvas.height = mapImage.naturalHeight;
                
                const maxDesired = mapImage.naturalWidth * 1.5;
                const maxAvailable = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.7);
                baseViewportSize = Math.min(maxDesired, maxAvailable);
                
                scrollContainer.style.width = baseViewportSize + 'px';
                scrollContainer.style.height = baseViewportSize + 'px';
                
                zoomSlider.value = 1;
                applyZoom();
                
                drawSpawns(areaId);
            };
            
            mapImage.onerror = () => {
                const currentSrc = mapImage.getAttribute('src');
                if (currentSrc && !currentSrc.startsWith('../')) {
                    mapImage.src = '../' + currentSrc;
                    return;
                }
                stats.textContent = 'Map image not found: ' + (currentSrc || (areaId + '.gif'));
            };
        }

        function drawSpawns(areaId) {
            if (!areaId) return;
            ctx.clearRect(0, 0, spawnCanvas.width, spawnCanvas.height);
            currentSpawns = [];

            const hexZoneId = areaId.split('_')[0];
            const bounds = mapData.maps[areaId];
            if (!bounds) {
                stats.textContent = 'No map calibration bounds found for ' + areaId;
                return;
            }

            const spawns = mapData.spawns[hexZoneId];
            if (!spawns || spawns.length === 0) {
                stats.textContent = 'No spawn points found for this zone.';
                return;
            }

            let drawCount = 0;
            
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1;

            spawns.forEach(spawn => {
                if (!checkedMobs.has(spawn.name)) {
                    return;
                }

                if (bounds.boxes && bounds.boxes.length > 0) {
                    const inBox = bounds.boxes.some(b => 
                        spawn.x >= b.minX && spawn.x <= b.maxX &&
                        spawn.y >= b.minY && spawn.y <= b.maxY &&
                        spawn.z >= b.minZ && spawn.z <= b.maxZ
                    );
                    if (!inBox) return;
                } else if (spawn.y < bounds.minY || spawn.y > bounds.maxY) {
                    return;
                }

                const mapScaleX = spawnCanvas.width / 256;
                const mapScaleY = spawnCanvas.height / 256;
                
                const pixelX = ((spawn.x * bounds.scaleX) + bounds.offsetX) * mapScaleX;
                const pixelY = ((spawn.z * bounds.scaleZ) + bounds.offsetZ) * mapScaleY;

                const localId = spawn.id & 0xFFF;
                const specificFlash = flashingMobs.get(spawn.name + '_' + localId);
                const generalFlash = flashingMobs.get(spawn.name);
                const flashStart = specificFlash || generalFlash;
                let isFlashing = false;
                let flashProgress = 0;
                
                if (flashStart !== undefined) {
                    const elapsed = Date.now() - flashStart;
                    if (elapsed < 300) {
                        isFlashing = true;
                        flashProgress = 1 - (elapsed / 300);
                    }
                }

                const currentZoom = parseFloat(zoomSlider.value);
                let dotRadius = 15 - ((currentZoom - 1) * 3.25);
                let flashExtra = 4;
                let phOutlineOffset = 2;
                let phOutlineWidth = 3;
                
                if (bounds && bounds.ext === 'gif') {
                    dotRadius *= 0.2;
                    flashExtra *= 0.3;
                    phOutlineOffset = 0.75;
                    phOutlineWidth = 1.2;
                }
                
                if (hoveredLegendMobName && spawn.name !== hoveredLegendMobName) {
                    ctx.globalAlpha = 0.2;
                } else {
                    ctx.globalAlpha = 1.0;
                }

                ctx.beginPath();
                if (isFlashing) {
                    const currentRadius = dotRadius + (flashExtra * flashProgress); 
                    ctx.arc(pixelX, pixelY, currentRadius, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ffffff';
                } else {
                    ctx.arc(pixelX, pixelY, dotRadius, 0, 2 * Math.PI);
                    ctx.fillStyle = stringToColor(spawn.name);
                }
                const isGif = bounds && bounds.ext === 'gif';

                ctx.fill();

                // Black contrast under-stroke directly on the dot edge
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = isGif ? 2.2 : 3.5;
                ctx.stroke();

                // Connected Red/Blue aggro border directly on the dot edge
                ctx.strokeStyle = (spawn.aggro === 1) ? '#ff3333' : '#33bbff';
                ctx.lineWidth = isGif ? 1.2 : 2.0;
                ctx.stroke();

                if (spawn.isPH) {
                    const phOffset = isGif ? 1.5 : 3.0;
                    ctx.beginPath();
                    ctx.arc(pixelX, pixelY, dotRadius + phOffset, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = phOutlineWidth;
                    ctx.stroke();
                }

                currentSpawns.push({
                    pixelX: pixelX,
                    pixelY: pixelY,
                    data: spawn
                });
                
                drawCount++;
            });
            
            ctx.globalAlpha = 1.0;

            // Update Map Legend
            const drawnMobNames = [...new Set(currentSpawns.map(s => s.data.name))].sort();
            const newLegendKey = drawnMobNames.join(',');
            
            if (legendItems.dataset.lastKey !== newLegendKey) {
                legendItems.dataset.lastKey = newLegendKey;
                legendItems.innerHTML = '';
                
                if (drawnMobNames.length > 0) {
                drawnMobNames.forEach(mobName => {
                    const cleanName = mobName.replace(/_/g, ' ');
                    const legendRow = document.createElement('div');
                    legendRow.style.display = 'flex';
                    legendRow.style.alignItems = 'center';
                    legendRow.style.gap = '8px';
                    legendRow.style.fontSize = '14px';
                    legendRow.style.cursor = 'default';
                    
                    legendRow.addEventListener('mouseover', () => {
                        hoveredLegendMobName = mobName;
                        if (!animationFrameId) renderLoop();
                    });
                    legendRow.addEventListener('mouseout', () => {
                        if (hoveredLegendMobName === mobName) {
                            hoveredLegendMobName = null;
                            if (!animationFrameId) renderLoop();
                        }
                    });
                    
                    const mobSpawns = currentSpawns.filter(s => s.data.name === mobName);
                    const isAggro = mobSpawns.some(s => s.data.aggro === 1);

                    const dot = document.createElement('div');
                    dot.style.width = '12px';
                    dot.style.height = '12px';
                    dot.style.borderRadius = '50%';
                    dot.style.backgroundColor = stringToColor(mobName);
                    dot.style.border = isAggro ? '2px solid #ff3333' : '2px solid #33bbff';
                    dot.style.boxShadow = 'inset 0 0 0 1px #000, 0 0 0 1px #000';
                    dot.style.outline = 'none';
                    dot.style.flexShrink = '0';
                    
                    let minL = Infinity, maxL = -Infinity;
                    mobSpawns.forEach(s => {
                        if (s.data.minLevel && s.data.minLevel > 0) minL = Math.min(minL, s.data.minLevel);
                        if (s.data.maxLevel && s.data.maxLevel > 0) maxL = Math.max(maxL, s.data.maxLevel);
                    });
                    let lvlText = (minL !== Infinity && maxL !== -Infinity) ? (minL === maxL ? 'Lvl ' + minL : 'Lvl ' + minL + '-' + maxL) : '';

                    const label = document.createElement('span');
                    label.textContent = cleanName;
                    label.style.overflow = 'hidden';
                    label.style.textOverflow = 'ellipsis';
                    label.style.whiteSpace = 'nowrap';

                    let lvlBadge = null;
                    if (lvlText) {
                        lvlBadge = document.createElement('span');
                        lvlBadge.style.marginLeft = 'auto';
                        lvlBadge.style.fontSize = '11px';
                        lvlBadge.style.color = '#aaa';
                        lvlBadge.style.backgroundColor = '#181818';
                        lvlBadge.style.border = '1px solid #444';
                        lvlBadge.style.borderRadius = '3px';
                        lvlBadge.style.padding = '1px 5px';
                        lvlBadge.style.whiteSpace = 'nowrap';
                        lvlBadge.style.flexShrink = '0';
                        lvlBadge.textContent = lvlText;
                    }
                    
                    const infoBtn = document.createElement('span');
                    infoBtn.innerHTML = '&#9432;';
                    infoBtn.title = 'Flash spawn points on map';
                    infoBtn.style.cursor = 'pointer';
                    infoBtn.style.color = '#888';
                    infoBtn.style.fontSize = '16px';
                    infoBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        flashingMobs.set(mobName, Date.now());
                        if (!animationFrameId) {
                            renderLoop();
                        }
                    });
                    infoBtn.addEventListener('mouseover', () => { infoBtn.style.color = '#fff'; });
                    infoBtn.addEventListener('mouseout', () => { infoBtn.style.color = '#888'; });
                    
                    const wikiUrlName = mobName;
                    const externalLink = document.createElement('a');
                    externalLink.href = 'https://ffxiclopedia.fandom.com/wiki/' + wikiUrlName;
                    externalLink.target = '_blank';
                    externalLink.innerHTML = '&#8599;';
                    externalLink.title = 'View ' + cleanName + ' on FFXIclopedia';
                    externalLink.style.textDecoration = 'none';
                    externalLink.style.color = '#888';
                    externalLink.style.fontSize = '15px';
                    externalLink.style.fontWeight = 'bold';
                    externalLink.style.padding = '0 2px';
                    externalLink.addEventListener('mouseover', () => { externalLink.style.color = '#fff'; });
                    externalLink.addEventListener('mouseout', () => { externalLink.style.color = '#888'; });

                    const removeBtn = document.createElement('span');
                    removeBtn.innerHTML = '&#10006;';
                    removeBtn.title = 'Hide this mob from map';
                    removeBtn.style.cursor = 'pointer';
                    removeBtn.style.color = '#888';
                    removeBtn.style.fontSize = '12px';
                    removeBtn.style.padding = '0 2px';
                    removeBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        checkedMobs.delete(mobName);
                        checkedMobs.add('__unselected_' + mobName);
                        const cbs = mobFilterContainer.querySelectorAll('input[type="checkbox"]');
                        for (const cb of cbs) {
                            if (cb.value === mobName) {
                                cb.checked = false;
                                break;
                            }
                        }
                        drawSpawns(activeZoneId);
                    });
                    removeBtn.addEventListener('mouseover', () => { removeBtn.style.color = '#ff4444'; });
                    removeBtn.addEventListener('mouseout', () => { removeBtn.style.color = '#888'; });
                    
                    legendRow.appendChild(dot);
                    legendRow.appendChild(label);
                    if (lvlBadge) legendRow.appendChild(lvlBadge);
                    legendRow.appendChild(infoBtn);
                    legendRow.appendChild(externalLink);
                    legendRow.appendChild(removeBtn);

                    legendRow.addEventListener('mouseenter', (e) => showMobSummaryTooltip(e, mobName, hexZoneId));
                    legendRow.addEventListener('mousemove', (e) => {
                        if (!tooltipFrozen && tooltip.style.display === 'block') {
                            updateTooltipPosition(e);
                        }
                    });
                    legendRow.addEventListener('mouseleave', hideMobSummaryTooltip);
                    legendRow.addEventListener('click', (e) => {
                        if (e.target === infoBtn || e.target === externalLink || e.target === removeBtn) return;
                        freezeMobSummaryTooltip(e, mobName, hexZoneId);
                    });

                    legendItems.appendChild(legendRow);
                });
                } else {
                    legendItems.innerHTML = '<span style="color: #888; font-size: 14px;">No mobs selected.</span>';
                }
            }

            const zObj = zonesData.find(z => z.areaId === areaId);
            const zName = zObj ? zObj.name : areaId;
            stats.textContent = `${zName}: Showing ${drawCount} spawn points.`;
        }
        
        function renderLoop() {
            let activeFlashes = 0;
            const now = Date.now();
            
            for (const [mob, startTime] of flashingMobs.entries()) {
                if (now - startTime > 300) {
                    flashingMobs.delete(mob);
                } else {
                    activeFlashes++;
                }
            }
            
            if (activeZoneId) drawSpawns(activeZoneId);
            
            if (activeFlashes > 0) {
                animationFrameId = requestAnimationFrame(renderLoop);
            } else {
                animationFrameId = null;
            }
        }

        function showMobSummaryTooltip(e, mobName, hexZoneId) {
            if (tooltipFrozen) return;
            const hexId = hexZoneId || (activeZoneId ? activeZoneId.split('_')[0] : null);
            if (!hexId) return;
            const spawns = mapData.spawns[hexId] || [];
            const mobSpawns = spawns.filter(s => s.name === mobName);
            if (mobSpawns.length === 0) return;
            
            const repSpawn = mobSpawns.find(s => (s.drops && s.drops.length > 0) || (s.phList && s.phList.length > 0)) || mobSpawns[0];
            let minL = Infinity, maxL = -Infinity;
            mobSpawns.forEach(s => {
                if (s.minLevel && s.minLevel > 0) minL = Math.min(minL, s.minLevel);
                if (s.maxLevel && s.maxLevel > 0) maxL = Math.max(maxL, s.maxLevel);
            });
            if (minL !== Infinity && maxL !== -Infinity) {
                repSpawn.minLevel = minL;
                repSpawn.maxLevel = maxL;
            }
            
            tooltip.innerHTML = renderTooltipHTML(repSpawn);
            tooltip.classList.remove('frozen');
            tooltip.style.border = '1px solid #444';
            tooltip.style.boxShadow = 'none';
            tooltip.style.pointerEvents = 'none';
            tooltip.style.display = 'block';
            
            const closeBtn = tooltip.querySelector('.tooltip-close');
            if (closeBtn) closeBtn.style.display = 'none';
            
            updateTooltipPosition(e);
        }

        function freezeMobSummaryTooltip(e, mobName, hexZoneId) {
            const hexId = hexZoneId || (activeZoneId ? activeZoneId.split('_')[0] : null);
            if (!hexId) return;
            const spawns = mapData.spawns[hexId] || [];
            const mobSpawns = spawns.filter(s => s.name === mobName);
            if (mobSpawns.length === 0) return;
            
            const repSpawn = mobSpawns.find(s => (s.drops && s.drops.length > 0) || (s.phList && s.phList.length > 0)) || mobSpawns[0];
            let minL = Infinity, maxL = -Infinity;
            mobSpawns.forEach(s => {
                if (s.minLevel && s.minLevel > 0) minL = Math.min(minL, s.minLevel);
                if (s.maxLevel && s.maxLevel > 0) maxL = Math.max(maxL, s.maxLevel);
            });
            if (minL !== Infinity && maxL !== -Infinity) {
                repSpawn.minLevel = minL;
                repSpawn.maxLevel = maxL;
            }
            
            tooltip.innerHTML = renderTooltipHTML(repSpawn);
            tooltipFrozen = true;
            tooltip.classList.add('frozen');
            tooltip.style.border = '2px solid #57a1f8';
            tooltip.style.boxShadow = '0 0 15px rgba(87, 161, 248, 0.4)';
            tooltip.style.pointerEvents = 'auto';
            
            const closeBtn = tooltip.querySelector('.tooltip-close');
            if (closeBtn) closeBtn.style.display = 'block';

            updateTooltipPosition(e);
        }

        function hideMobSummaryTooltip() {
            if (!tooltipFrozen) {
                tooltip.style.display = 'none';
            }
        }

        function updateTooltipPosition(e) {
            const padding = 15;
            let left = e.pageX + padding;
            let top = e.pageY + padding;
            
            tooltip.style.display = 'block';
            const rect = tooltip.getBoundingClientRect();
            
            if (left + rect.width > window.innerWidth + window.scrollX - padding) {
                left = e.pageX - rect.width - padding;
            }
            
            if (top + rect.height > window.innerHeight + window.scrollY - padding) {
                top = e.pageY - rect.height - padding;
            }
            
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }

        window.closeFrozenTooltip = function(e) {
            e.stopPropagation();
            tooltipFrozen = false;
            tooltip.classList.remove('frozen');
            tooltip.style.border = '1px solid #444';
            tooltip.style.boxShadow = 'none';
            tooltip.style.pointerEvents = 'none';
            tooltip.style.display = 'none';
        };

        function renderTooltipHTML(s) {
            const localHexId = (s.id & 0xFFF).toString(16).toUpperCase().padStart(3, '0');
            const phStr = s.isPH ? ' <span style="color:#ff3333;">[PH]</span>' : '';
            let lvlText = '';
            if (s.minLevel && s.minLevel > 0) {
                lvlText = s.minLevel === s.maxLevel ? ('Lvl ' + s.minLevel) : ('Lvl ' + s.minLevel + '-' + s.maxLevel);
            }
            let html = '<div style="font-size: 14px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px;">' +
                       '<div><strong>' + s.name.replace(/_/g, ' ') + ' (' + localHexId + ')' + phStr + '</strong>' +
                       (lvlText ? '<div style="font-size:12px; color:#ffcc66; font-weight:500; margin-top:2px;">' + lvlText + '</div>' : '') +
                       '</div>' +
                       '<span class="tooltip-close" onclick="closeFrozenTooltip(event)" style="display:none; cursor:pointer; color:#888; font-weight:bold; padding:0 2px;" onmouseover="this.style.color=\'#ff4444\'" onmouseout="this.style.color=\'#888\'">&#10006;</span>' +
                       '</div>';
            
            if (s.phFor && s.phFor.length > 0) {
                html += '<div style="font-size:12px; color:#f0a000; margin-bottom: 8px;"><strong>PH for:</strong> ';
                s.phFor.forEach((nmName, index) => {
                    if (index > 0) html += ', ';
                    const safeName = nmName.replace(/'/g, "\\'");
                    html += '<a href="javascript:void(0)" onclick="addFilter(\'' + safeName + '\')" style="color:#66b3ff; text-decoration:none;" onmouseover="this.style.textDecoration=\'underline\'" onmouseout="this.style.textDecoration=\'none\'">' + nmName.replace(/_/g, ' ') + '</a>';
                });
                html += '</div>';
            }

            
            if (s.drops && s.drops.length > 0) {
                html += '<div style="margin-top: 12px; border-top: 1px solid #555; padding-top: 8px; font-size: 14px;"><strong>Drops:</strong></div>';
                const sortedDrops = [...s.drops].sort((a, b) => parseFloat(b.rate) - parseFloat(a.rate));
                sortedDrops.forEach(drop => {
                    const cleanItemName = drop.name;
                    const displayItemName = (drop.count && drop.count > 1) ? drop.name + ' (1-' + drop.count + 'x)' : drop.name;
                    
                    let wikiBaseName = drop.name;
                    const ofIndex = wikiBaseName.toLowerCase().indexOf(' of ');
                    if (ofIndex !== -1) {
                        wikiBaseName = wikiBaseName.substring(ofIndex + 4);
                    }
                    const wikiUrlName = wikiBaseName.replace(/ /g, '_');
                    
                    const linkStr = '<a href="https://ffxiclopedia.fandom.com/wiki/' + wikiUrlName + '" target="_blank" style="text-decoration: none; color: #888; margin-left: 8px; font-size: 15px; font-weight: bold; padding: 2px 5px;" title="View ' + cleanItemName + ' on FFXIclopedia" onmouseover="this.style.color=\'#fff\'" onmouseout="this.style.color=\'#888\'">↗</a>';
                    html += '<div style="display: flex; justify-content: space-between; align-items: center; gap: 20px; font-size: 14px; padding: 4px 0;">' +
                        '<span style="display: flex; align-items: center;">' + displayItemName + linkStr + '</span>' +
                        '<span style="color: #bbb;">' + drop.rate + '</span>' +
                    '</div>';
                });
                html += '</div>';
            }
            
            if (s.phList && s.phList.length > 0) {
                const clickablePHs = s.phList.map(phString => {
                    const parenIndex = phString.indexOf(' (');
                    let filterName = phString;
                    let hexIdsStr = '';
                    if (parenIndex !== -1) {
                        filterName = phString.substring(0, parenIndex).trim();
                        hexIdsStr = phString.substring(parenIndex + 2, phString.length - 1);
                    }
                    return '<a href="#" onclick="event.preventDefault(); window.addFilter(\'' + filterName.replace(/'/g, "\\'") + '\', \'' + hexIdsStr + '\');" style="color: #57a1f8; text-decoration: none;" onmouseover="this.style.textDecoration=\'underline\'" onmouseout="this.style.textDecoration=\'none\'">' + phString + '</a>';
                });
                
                html += '<div style="margin-top: 12px; border-top: 1px solid #555; padding-top: 8px; font-size: 14px;"><strong>Placeholders: </strong>' + clickablePHs.join(', ') + '</div>';
                if (s.phRate) {
                    html += '<div style="margin-top: 4px; font-size: 13px; color: #a8e6cf;"><strong>Spawn Chance:</strong> ' + s.phRate + '%</div>';
                }
                if (s.cooldown) {
                    html += '<div style="margin-top: 4px; font-size: 13px; color: #ffd369;"><strong>Respawn Cooldown:</strong> ' + s.cooldown + '</div>';
                }
            } else if (s.cooldown) {
                html += '<div style="margin-top: 12px; border-top: 1px solid #555; padding-top: 8px; font-size: 14px; color: #ffd369;"><strong>Respawn Cooldown:</strong> ' + s.cooldown + '</div>';
            }
            return html;
        }

        mapContainer.addEventListener('mousemove', (e) => {
            if (tooltipFrozen) return;
            if (hasDragged) return;

            const rect = mapImage.getBoundingClientRect();
            if (!rect.width || !rect.height) return;

            const scaleX = mapImage.naturalWidth / rect.width;
            const scaleY = mapImage.naturalHeight / rect.height;

            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            const hitRadius = 20 * (mapImage.naturalWidth / rect.width);
            const hitRadiusSq = hitRadius * hitRadius;

            let closestSpawn = null;
            let minDistance = hitRadiusSq;

            for (const spawn of currentSpawns) {
                const dx = mouseX - spawn.pixelX;
                const dy = mouseY - spawn.pixelY;
                const distSq = dx*dx + dy*dy;
                
                if (distSq < minDistance) {
                    minDistance = distSq;
                    closestSpawn = spawn;
                }
            }

            if (closestSpawn) {
                const s = closestSpawn.data;
                tooltip.innerHTML = renderTooltipHTML(s);
                tooltip.classList.remove('frozen');
                tooltip.style.border = '1px solid #444';
                tooltip.style.boxShadow = 'none';
                tooltip.style.pointerEvents = 'none';
                
                const closeBtn = tooltip.querySelector('.tooltip-close');
                if (closeBtn) closeBtn.style.display = 'none';
                
                updateTooltipPosition(e);
            } else {
                tooltip.style.display = 'none';
            }
        });

        mapContainer.addEventListener('mouseleave', () => {
            if (!tooltipFrozen) {
                tooltip.style.display = 'none';
            }
        });

        mapContainer.addEventListener('click', (e) => {
            if (hasDragged) return;

            const rect = mapImage.getBoundingClientRect();
            if (!rect.width || !rect.height) return;

            const scaleX = mapImage.naturalWidth / rect.width;
            const scaleY = mapImage.naturalHeight / rect.height;

            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            const hitRadius = 20 * (mapImage.naturalWidth / rect.width);
            const hitRadiusSq = hitRadius * hitRadius;

            let closestSpawn = null;
            let minDistance = hitRadiusSq;

            for (const spawn of currentSpawns) {
                const dx = mouseX - spawn.pixelX;
                const dy = mouseY - spawn.pixelY;
                const distSq = dx*dx + dy*dy;
                
                if (distSq < minDistance) {
                    minDistance = distSq;
                    closestSpawn = spawn;
                }
            }

            if (closestSpawn) {
                const s = closestSpawn.data;
                tooltip.innerHTML = renderTooltipHTML(s);
                tooltipFrozen = true;
                tooltip.classList.add('frozen');
                tooltip.style.border = '2px solid #57a1f8';
                tooltip.style.boxShadow = '0 0 15px rgba(87, 161, 248, 0.4)';
                tooltip.style.pointerEvents = 'auto';
                
                const closeBtn = tooltip.querySelector('.tooltip-close');
                if (closeBtn) closeBtn.style.display = 'block';

                updateTooltipPosition(e);
            } else {
                if (tooltipFrozen) {
                    tooltipFrozen = false;
                    tooltip.classList.remove('frozen');
                    tooltip.style.border = '1px solid #444';
                    tooltip.style.boxShadow = 'none';
                    tooltip.style.pointerEvents = 'none';
                    tooltip.style.display = 'none';
                }
            }
        });

        // Initialize default view
        populateZoneList();
        updateMobFilterContainer();
    </script>
</body>
</html>
